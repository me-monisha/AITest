# Render Blueprint - one web service (API + UI) and a managed Postgres DB.
# Deploy: push this repo to GitHub, then Render Dashboard -> New -> Blueprint.
services:
  - type: web
    name: aivoa-deviation-module
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false          # Render prompts you for this value on first deploy
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: DATABASE_URL
        fromDatabase:
          name: aivoa-deviations-db
          property: connectionString

databases:
  - name: aivoa-deviations-db
    plan: free
    databaseName: aivoa_deviations
    user: aivoa
